<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Todos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Todo App</h1>

    <form id="todo-form" class="todo-form" aria-label="Add todo">
      <input id="todo-input" type="text" placeholder="Add a new todo..." aria-label="Todo text" />
      <button id="add-btn" type="submit">Add</button>
    </form>

    <div class="controls">
      <div class="filters" role="tablist" aria-label="Filter todos">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
      <button id="clear-completed" class="muted">Clear completed</button>
    </div>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <div id="stats" class="stats"></div>
  </main>

  <template id="todo-item-template">
    <li class="todo-item">
      <label class="left">
        <input type="checkbox" class="toggle" />
        <span class="text"></span>
      </label>
      <div class="right">
        <button class="edit" title="Edit">✏️</button>
        <button class="delete" title="Delete">🗑️</button>
      </div>
    </li>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
